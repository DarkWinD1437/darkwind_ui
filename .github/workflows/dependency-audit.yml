name: Auditoría de dependencias

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Todos los lunes a las 09:00 UTC, para detectar CVEs publicados después del último push.
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  pnpm-audit:
    name: pnpm audit (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  cargo-audit:
    name: cargo audit (Rust/Tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
        working-directory: src-tauri
